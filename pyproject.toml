[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vgm2151fur"
version = "0.9.43"
description = "Transcribe YM2151/YM2203/YM2612 + sample-chip VGMs into Furnace .fur modules"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["vgm", "ym2151", "ym2203", "ym2612", "genesis", "furnace", "chiptune", "arcade"]

[project.scripts]
vgm2151fur = "vgm2151fur.__main__:main"

[tool.setuptools]
packages = ["vgm2151fur"]
